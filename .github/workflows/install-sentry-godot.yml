name: Install Sentry Godot SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-sentry-godot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sentry Godot SDK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/getsentry/sentry-godot/releases/download/2.1.1/sentry-godot-2.1.1%2Bd288ad9.zip"
          rm -rf addons/sentry /tmp/sentry-godot
          mkdir -p /tmp/sentry-godot
          curl -fsSL "$URL" -o /tmp/sentry-godot/sentry.zip
          unzip -q /tmp/sentry-godot/sentry.zip -d .
          test -f addons/sentry/README.md
          test -d addons/sentry/bin

      - name: Commit installed SDK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/sentry
          if git diff --cached --quiet; then
            echo "Sentry SDK already installed."
            exit 0
          fi
          git commit -m "chore: install Sentry Godot SDK 2.1.1 [skip ci]"
          git push

# Sentry installer verified by ChatGPT.
