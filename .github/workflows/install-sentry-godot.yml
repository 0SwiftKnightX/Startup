name: Install Sentry Godot SDK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-sentry-godot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sentry Godot SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="2.2.0"
          URL="https://github.com/getsentry/sentry-godot/releases/download/${VERSION}/sentry-godot-${VERSION}%2B407729a.zip"
          rm -rf /tmp/sentry-godot
          mkdir -p /tmp/sentry-godot
          curl -fsSL "${URL}" -o /tmp/sentry-godot/sentry.zip
          unzip -q /tmp/sentry-godot/sentry.zip -d /tmp/sentry-godot/extracted
          PLUGIN_CFG="$(find /tmp/sentry-godot/extracted -type f -path '*/addons/sentry/plugin.cfg' -print -quit)"
          test -n "${PLUGIN_CFG}"
          PLUGIN_DIR="$(dirname "${PLUGIN_CFG}")"
          rm -rf addons/sentry
          mkdir -p addons
          cp -a "${PLUGIN_DIR}" addons/sentry

      - name: Commit installed SDK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/sentry
          if git diff --cached --quiet; then
            echo "Sentry SDK already installed."
            exit 0
          fi
          git commit -m "chore: install Sentry Godot SDK 2.2.0 [skip ci]"
          git push
